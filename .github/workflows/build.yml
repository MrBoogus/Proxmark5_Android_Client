name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Package APKs & SHA-256 Checksums
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/release/*.apk "dist/Proxmark5-Android-Client-${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/Proxmark5-Android-Client-${VERSION}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proxmark5-Android-Client-APKs
          path: dist/*

      - name: Attach APKs to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Proxmark5 Android Client — $TAG" --generate-notes
          fi
